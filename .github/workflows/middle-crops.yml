name: F6.3 middle-section crops
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/middle-crops.yml'
      - 'middle-section/crops.py'
      - 'middle-section/middle-section-bg.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Generate crops
        run: python middle-section/crops.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add middle-section/middle-top-left.png middle-section/middle-top-right.png middle-section/middle-side-left.png middle-section/middle-side-right.png middle-section/middle-bottom.png
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Przetnij kadry F6.3 (top-left 36x22, top-right 122x22 wg granic pastylki)"
          git push
